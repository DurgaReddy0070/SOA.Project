<!DOCTYPE html>
<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    :root {

      --font-display: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Warm Minimalist Palette */
      --bg-app: #FAF8F5;
      --bg-sidebar: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-subtle: #F7F5F0;
      --bg-input: #FAF8F5;
      --bg-hover: #F3EFEA;

      /* Borders */

      --border-subtle: #E2DBD0;

      /* Text */

      --text-secondary: #57534E;
      --text-muted: #8C827A;

      /* Primary Emerald */
      --emerald-900: #064E3B;
      --emerald-800: #065F46;
      --emerald-700: #166534;
      --emerald-600: #15803D;
      --emerald-100: #DCFCE7;
      --emerald-50: #F0FDF4;

      /* Amber */
      --amber-700: #B45309;
      --amber-600: #D97706;
      --amber-50: #FFFBEB;

      /* Terracotta */
      --terracotta-500: #EA580C;
      --terracotta-50: #FFF7ED;

      /* Shadows */
      --shadow-xs: 0 1px 2px rgba(28, 25, 23, 0.03);
      --shadow-sm: 0 1px 3px rgba(28, 25, 23, 0.05), 0 1px 2px rgba(28, 25, 23, 0.03);
      --shadow-md: 0 4px 12px -2px rgba(28, 25, 23, 0.05), 0 2px 6px -1px rgba(28, 25, 23, 0.03);
      --shadow-lg: 0 10px 25px -4px rgba(28, 25, 23, 0.07);

      /* Radius */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-app);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    input, select, textarea {
      font-family: inherit;
      font-size: 0.92rem;
      color: var(--text-primary);
      background: var(--bg-input);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--emerald-700);
      box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.1);
      background: #FFFFFF;
    }

    /* Layout Shell */
    .app-layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 40;
    }

    .sidebar-header {
      padding: 22px 20px 18px 20px;
      border-bottom: 1px solid var(--border-light);
    }

    .brand-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-emblem {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--emerald-800) 0%, var(--emerald-600) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 4px 10px rgba(22, 101, 52, 0.25);
      flex-shrink: 0;
      font-weight: 800;
      font-size: 1.1rem;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--emerald-700);
      margin-top: 2px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }

    .nav-section-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 10px 12px 6px 12px;
    }

    .nav-item-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-secondary);
      text-align: left;
    }

    .nav-item-btn:hover {
      background-color: var(--bg-hover);
      color: var(--text-primary);
    }

    .nav-item-btn.active {
      background-color: var(--emerald-50);
      color: var(--emerald-800);
      font-weight: 600;
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border-light);
      background-color: #FAF8F5;
    }

    .main-wrapper {
      margin-left: 260px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 100vh;
    }

    .top-navbar {
      height: 68px;
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .content-body {
      padding: 32px;
      flex: 1;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    /* Cards */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      padding: 24px;

    .card:hover {
      box-shadow: var(--shadow-md);

    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    /* Buttons */
    .btn-primary {
      background-color: var(--emerald-700);
      color: #FFFFFF;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(22, 101, 52, 0.2);
    }

    .btn-primary:hover {
      background-color: var(--emerald-800);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: #FFFFFF;
      color: var(--text-primary);
      border: 1px solid var(--border-light);
      font-size: 0.88rem;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-secondary:hover {
      background-color: var(--bg-hover);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 600;
    }

    .badge-veg { background-color: #DCFCE7; color: #166534; border: 1px solid #BBF7D0; }
    .badge-jain { background-color: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; }
    .badge-vegan { background-color: #E0E7FF; color: #3730A3; border: 1px solid #C7D2FE; }
    .badge-nonveg { background-color: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; }
    .badge-emerald { background-color: var(--emerald-50); color: var(--emerald-800); border: 1px solid var(--emerald-100); }
    .badge-rating { background-color: #FFFBEB; color: #B45309; border: 1px solid #FDE68A; font-weight: 700; }

    /* Hero */
    .hero-dashboard {
      background: linear-gradient(135deg, #FFFFFF 0%, #FAF8F5 100%);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 36px 40px;
      margin-bottom: 28px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 28px;
    }

    .metric-card {
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 22px 24px;
      box-shadow: var(--shadow-xs);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .metric-number {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .metric-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .progress-bar-track {
      height: 8px;
      background-color: #EFEAE2;
      border-radius: var(--radius-full);
      overflow: hidden;
      margin: 8px 0;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--emerald-600) 0%, var(--emerald-500) 100%);
      border-radius: var(--radius-full);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(28, 25, 23, 0.45);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      max-width: 650px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-light);
      padding: 28px;
    }
  </style>
</head>

                      <div style={{ background: '#FAF8F5', padding: '14px', borderRadius: '12px' }}>
                        <div style={{ fontSize: '0.7rem', fontWeight: 700, color: 'var(--text-muted)' }}>TOTAL BUDGET</div>
                        <div style={{ fontSize: '1.25rem', fontWeight: 800 }}>₹2,00,000</div>
                      </div>
                      <div style={{ background: 'var(--emerald-50)', padding: '14px', borderRadius: '12px' }}>
                        <div style={{ fontSize: '0.7rem', fontWeight: 700, color: 'var(--emerald-800)' }}>ESTIMATED FOOD COST</div>
                        <div style={{ fontSize: '1.25rem', fontWeight: 800, color: 'var(--emerald-800)' }}>₹1,53,280</div>
                      </div>
                      <div style={{ background: 'var(--amber-50)', padding: '14px', borderRadius: '12px' }}>
                        <div style={{ fontSize: '0.7rem', fontWeight: 700, color: 'var(--amber-700)' }}>REMAINING</div>
                        <div style={{ fontSize: '1.25rem', fontWeight: 800, color: 'var(--amber-700)' }}>₹46,720</div>
                      </div>
                    </div>
                    <div style={{ fontSize: '0.82rem', fontWeight: 600 }}>Food: 76% | Staging: 15% | Logistics: 9%</div>
                  </div>
                </div>
              )}

              {/* AI ASSISTANT */}
              {activeTab === 'ai-assistant' && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }}>
                  <div className="card" style={{ background: 'linear-gradient(135deg, #FFFFFF 0%, var(--emerald-50) 100%)', padding: '30px' }}>
                    <div style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--emerald-800)', textTransform: 'uppercase', marginBottom: '6px' }}>
                      ✨ AI Event Planner
                    </div>
                    <h2 style={{ fontSize: '1.6rem', fontWeight: 800 }}>
                      Tell us what you're planning.<br />We'll help you make it happen.
                    </h2>
                    <div style={{ display: 'flex', gap: '10px', marginTop: '16px' }}>
                      <input
                        type="text"
                        value={aiQuery}
                        onChange={(e) => setAiQuery(e.target.value)}
                        style={{ flex: 1, background: '#FFFFFF', padding: '12px 16px' }}
                      />
                      <button className="btn-primary" onClick={runAi}>
                        {aiLoading ? 'Analyzing...' : 'Plan with AI →'}
                      </button>
                    </div>
                  </div>

                  {/* Recommendation Card */}
                  <div className="card">
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                      <div>
                        <div style={{ fontSize: '0.74rem', fontWeight: 700, color: 'var(--emerald-800)', textTransform: 'uppercase' }}>
                          ✨ AI Recommendation
                        </div>
                        <h3 style={{ fontSize: '1.25rem', fontWeight: 800 }}>Best catering option for your wedding</h3>
                      </div>
                      <span className="badge badge-emerald">96% High Confidence</span>
                    </div>

                    <div style={{ background: '#FAF8F5', padding: '18px', borderRadius: '12px', border: '1px solid var(--border-light)', marginBottom: '16px' }}>
                      <h4 style={{ fontSize: '1.15rem', fontWeight: 800 }}>Green Leaf Pure Veg &amp; Jain Kitchen</h4>
                      <div style={{ color: 'var(--amber-700)', fontWeight: 700, fontSize: '0.85rem' }}>★★★★★ 4.9 • ₹620 / person</div>
                      <div style={{ display: 'flex', gap: '16px', marginTop: '10px', fontSize: '0.85rem' }}>
                        <span>Estimated Total: <strong>₹1,53,280</strong></span>
                        <span>Budget Remaining: <strong style={{ color: 'var(--emerald-700)' }}>₹46,720</strong></span>
                      </div>
                    </div>

                    <h4 style={{ fontSize: '0.95rem', fontWeight: 700, marginBottom: '8px' }}>WHY THIS OPTION?</h4>
                    <ul style={{ listStyle: 'none', display: 'flex', flexDirection: 'column', gap: '6px', fontSize: '0.85rem' }}>
                      <li>✓ Supports vegetarian &amp; strict Jain requirements</li>
                      <li>✓ Suitable for 250 guests in Vijayawada</li>
                      <li>✓ Fits your budget comfortably</li>
                      <li>✓ Strong vendor rating (4.9 / 410 reviews)</li>
                      <li>✓ Grounded in verified service data</li>
                    </ul>
                  </div>
                </div>
              )}

              {/* VENDORS */}
              {activeTab === 'vendors' && (
                <div>
                  <h2 style={{ fontSize: '1.35rem', fontWeight: 800, marginBottom: '16px' }}>Catering Vendor Marketplace</h2>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '20px' }}>
                    {vendors.map(v => (
                      <div key={v.id} className="card" style={{ padding: '20px' }}>
                        <h3 style={{ fontSize: '1.15rem', fontWeight: 800 }}>{v.name}</h3>
                        <div style={{ color: 'var(--amber-700)', fontWeight: 700, fontSize: '0.84rem' }}>★ {v.rating} ({v.ratingCount})</div>
                        <p style={{ fontSize: '0.8rem', color: 'var(--text-secondary)', margin: '8px 0' }}>{v.description}</p>
                        <div style={{ display: 'flex', gap: '6px', marginBottom: '12px' }}>
                          <span className="badge badge-veg">VEG</span>
                          <span className="badge badge-jain">JAIN</span>
                          <span className="badge badge-emerald">Capacity: {v.maxGuests}</span>
                        </div>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderTop: '1px solid var(--border-light)', paddingTop: '12px' }}>
                          <span style={{ fontSize: '1.1rem', fontWeight: 800, color: 'var(--emerald-800)' }}>₹{v.pricePerPerson} / person</span>
                          <button className="btn-primary" onClick={() => setActiveTab('menu-planner')}>View Menu</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* SERVICE HEALTH */}
              {activeTab === 'soa-health' && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                  <h2 style={{ fontSize: '1.35rem', fontWeight: 800 }}>Service Health (SOA Topology)</h2>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '16px' }}>
                    {[
                      'API Gateway Service (Port 8080)',
                      'Auth Service (Port 8081)',
                      'Event Service (Port 8082)',
                      'Vendor Service (Port 8083)',
                      'Order Service (Port 8084)',
                      'Payment Service (Port 8085)',
                      'AI Agent (Port 3000)',
                      'Eureka Registry (Port 8761)'
                    ].map(name => (
                      <div key={name} className="card" style={{ padding: '16px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                          <h4 style={{ fontSize: '0.9rem', fontWeight: 700 }}>{name}</h4>
                          <span className="badge badge-emerald">● Operational</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* OTHER TABS FALLBACK */}
              {!['overview', 'ai-assistant', 'vendors', 'soa-health'].includes(activeTab) && (
                <div className="card" style={{ textAlign: 'center', padding: '60px 20px' }}>
                  <h3 style={{ fontSize: '1.25rem', fontWeight: 700 }}>{navItems.find(n => n.id === activeTab)?.label}</h3>
                  <p style={{ fontSize: '0.84rem', color: 'var(--text-muted)', marginTop: '6px' }}>
                    Interactive module loaded in full React + Vite mode.
                  </p>
                  <button className="btn-primary" onClick={() => setActiveTab('overview')} style={{ marginTop: '16px' }}>
                    Return to Overview
                  </button>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
